name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            app_name: HolyFlow-Intel
            target_arch: x86_64
            artifact_name: HolyFlow-macOS-Intel.zip
          - runner: macos-14
            app_name: HolyFlow-AppleSilicon
            target_arch: arm64
            artifact_name: HolyFlow-macOS-AppleSilicon.zip
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build HolyFlow.app
        shell: bash
        env:
          APP_NAME: ${{ matrix.app_name }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          chmod +x ./scripts/build-mac-app.sh
          ./scripts/build-mac-app.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.app_name }}-macOS-App/${{ matrix.app_name }}.app
            dist/${{ matrix.app_name }}-macOS-App/README-MACOS.txt
